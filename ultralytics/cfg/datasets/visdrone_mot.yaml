# VisDrone MOT dataset config aligned with JackWoo0831/Easier_To_Use_TrackEval 5-class protocol.
# Default path points to your local test-dev split. Use --data to switch to a strict 10-class config if needed.

path: VisDrone/VisDrone2019-MOT-test-dev

names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor

benchmark:
  split: sequences
  annotations: annotations
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp"]
  class_offset: 1
  eval_classes:
    1: pedestrian
    4: car
    5: van
    6: truck
    9: bus
  distractor_classes:
    2: people
    3: bicycle
    8: awning-tricycle
    10: motor
    11: others
  ignore_region_classes: [0]
  zero_mark: true
  crowd_ignore_region:
    enabled: true
    ioa_threshold: 0.5
  truncation:
    enabled: true
    thresh: 0
  occlusion:
    enabled: true
    thresh: 1
