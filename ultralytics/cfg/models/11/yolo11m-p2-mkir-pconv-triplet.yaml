# YOLO11m-P2 + MKIR + C2f_PConv + TripletAttention
# Conservative port of the VisDrone v8 mainline to the YOLO11 family.
# Strategy:
# 1) Keep the YOLO11 stem and overall topology style.
# 2) Add a P2 branch for small-object detection.
# 3) Insert MKIR after each scale stage for multi-scale feature enhancement.
# 4) Replace deep P4/P5 blocks with C2f_PConv instead of rewriting all C3k2 blocks.
# 5) Add TripletAttention on the FAN P3 branch and all PAN outputs.

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2
  - [-1, 1, MKIR, [256, 2.0, [1, 3, 5], False, True]]   # 3 P2
  - [-1, 1, Conv, [256, 3, 2]]                 # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 5
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], False, True]]   # 6 P3
  - [-1, 1, Conv, [512, 3, 2]]                 # 7-P4/16
  - [-1, 2, C3k2_PConv, [512, True]]           # 8 deep replace
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], False, True]]   # 9 P4
  - [-1, 1, Conv, [1024, 3, 2]]                # 10-P5/32
  - [-1, 2, C3k2_PConv, [1024, True]]          # 11 deep replace
  - [-1, 1, SPPF, [1024, 5]]                   # 12
  - [-1, 2, C2PSA, [1024]]                     # 13
  - [-1, 1, MKIR, [1024, 2.0, [1, 3, 5], False, True]]  # 14 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]                  # cat backbone P4
  - [-1, 2, C3k2, [512, False]]                # 17 (FAN P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                  # cat backbone P3
  - [-1, 2, C3k2, [256, False]]                # 20
  - [-1, 1, TripletAttention, []]              # 21 FAN P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]                  # cat backbone P2
  - [-1, 2, C3k2, [128, False]]                # 24 (P2/4-xsmall)
  - [-1, 1, TripletAttention, []]              # 25 PAN P2

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 21], 1, Concat, [1]]                 # cat TripletAttention-refined FAN P3
  - [-1, 2, C3k2, [256, False]]                # 28 (P3/8-small)
  - [-1, 1, TripletAttention, []]              # 29 PAN P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]                 # cat FAN P4
  - [-1, 2, C3k2_PConv, [512, False]]          # 32 (P4/16-medium)
  - [-1, 1, TripletAttention, []]              # 33 PAN P4

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]                 # cat backbone P5
  - [-1, 2, C3k2_PConv, [1024, True]]          # 36 (P5/32-large)
  - [-1, 1, TripletAttention, []]              # 37 PAN P5

  - [[25, 29, 33, 37], 1, Detect, [nc]]        # Detect(P2, P3, P4, P5)
