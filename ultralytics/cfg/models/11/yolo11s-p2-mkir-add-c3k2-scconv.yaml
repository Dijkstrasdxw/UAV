# YOLO11s with P2 branch + MKIR(add) + C3k2_SCConv.
# Note:
# - Replace all C3k2 modules with C3k2_SCConv for a controlled comparison.
# - This is still a half-replacement design: only c3k=True branches activate ScConv;
#   c3k=False branches fall back to the original Bottleneck path.

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_SCConv, [256, False, 0.25]]
  - [-1, 1, MKIR, [256, 2.0, [1, 3, 5], True, True]] # 3 P2
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2_SCConv, [512, False, 0.25]]
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], True, True]] # 6 P3
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2_SCConv, [512, True]]
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], True, True]] # 9 P4
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 2, C3k2_SCConv, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
  - [-1, 1, MKIR, [1024, 2.0, [1, 3, 5], True, True]] # 14 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C3k2_SCConv, [512, False]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2_SCConv, [256, False]] # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 2, C3k2_SCConv, [128, False]] # 23 (P2/4)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 2, C3k2_SCConv, [256, False]] # 26 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2_SCConv, [512, False]] # 29 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2_SCConv, [1024, True]] # 32 (P5/32)

  - [[23, 26, 29, 32], 1, Detect, [nc]]
