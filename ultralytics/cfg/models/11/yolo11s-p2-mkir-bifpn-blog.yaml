# YOLO11s with P2 + MKIR(add) backbone and blog-style weighted-add BiFPN neck.
# All neck fusion nodes replace Concat with Bi_FPN for a uniform fusion strategy.

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, MKIR, [256, 2.0, [1, 3, 5], True, True]] # 3 P2
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], True, True]] # 6 P3
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], True, True]] # 9 P4
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
  - [-1, 1, MKIR, [1024, 2.0, [1, 3, 5], True, True]] # 14 P5

head:
  - [3, 1, Conv, [256]]   # 15-P2 lateral
  - [6, 1, Conv, [256]]   # 16-P3 lateral
  - [9, 1, Conv, [256]]   # 17-P4 lateral
  - [14, 1, Conv, [256]]  # 18-P5 lateral

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19 P5->P4
  - [[-1, 17], 1, Bi_FPN, []] # 20
  - [-1, 2, C3k2, [256, False]] # 21 P4_td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 22 P4->P3
  - [[-1, 16], 1, Bi_FPN, []] # 23
  - [-1, 2, C3k2, [256, False]] # 24 P3_td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 25 P3->P2
  - [[-1, 15], 1, Bi_FPN, []] # 26
  - [-1, 2, C3k2, [128, False]] # 27 P2_out

  - [-1, 1, Conv, [256, 3, 2]] # 28 P2->P3
  - [[-1, 16, 24], 1, Bi_FPN, []] # 29
  - [-1, 2, C3k2, [256, False]] # 30 P3_out

  - [-1, 1, Conv, [256, 3, 2]] # 31 P3->P4
  - [[-1, 17, 21], 1, Bi_FPN, []] # 32
  - [-1, 2, C3k2, [512, False]] # 33 P4_out

  - [-1, 1, Conv, [256, 3, 2]] # 34 P4->P5
  - [[-1, 18], 1, Bi_FPN, []] # 35
  - [-1, 2, C3k2, [1024, True]] # 36 P5_out

  - [[27, 30, 33, 36], 1, Detect, [nc]]
