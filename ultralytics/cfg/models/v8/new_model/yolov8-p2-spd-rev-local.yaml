# Ultralytics YOLOv8 with shallow-only Conv->SpaceToDepth (SPD-Conv reverse order) + P2 head
# Keep SPD only for P1->P2 and P2->P3 backbone downsampling. Restore standard stride-2 conv for P3->P4 and P4->P5.

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 1]]        # 0
  - [-1, 1, SpaceToDepth, [2]]       # 1  -> P1/2

  - [-1, 1, Conv, [128, 3, 1]]       # 2
  - [-1, 1, SpaceToDepth, [2]]       # 3  -> P2/4
  - [-1, 3, C2f, [128, True]]        # 4

  - [-1, 1, Conv, [256, 3, 1]]       # 5
  - [-1, 1, SpaceToDepth, [2]]       # 6  -> P3/8
  - [-1, 6, C2f, [256, True]]        # 7

  - [-1, 1, Conv, [512, 3, 2]]       # 8  -> P4/16 (standard downsample restored)
  - [-1, 6, C2f, [512, True]]        # 9

  - [-1, 1, Conv, [1024, 3, 2]]      # 10 -> P5/32 (standard downsample restored)
  - [-1, 3, C2f, [1024, True]]       # 11
  - [-1, 1, SPPF, [1024, 5]]         # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]        # 14 cat backbone P4
  - [-1, 3, C2f, [512]]              # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]        # 17 cat backbone P3
  - [-1, 3, C2f, [256]]              # 18 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # 20 cat backbone P2
  - [-1, 3, C2f, [128]]              # 21 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]       # 22 P2 -> P3 (standard PAN downsample)
  - [[-1, 18], 1, Concat, [1]]       # 23 cat head P3
  - [-1, 3, C2f, [256]]              # 24 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]       # 25 P3 -> P4 (standard PAN downsample)
  - [[-1, 15], 1, Concat, [1]]       # 26 cat head P4
  - [-1, 3, C2f, [512]]              # 27 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]       # 28 P4 -> P5 (standard PAN downsample)
  - [[-1, 12], 1, Concat, [1]]       # 29 cat head P5
  - [-1, 3, C2f, [1024]]             # 30 (P5/32-large)

  - [[21, 24, 27, 30], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
