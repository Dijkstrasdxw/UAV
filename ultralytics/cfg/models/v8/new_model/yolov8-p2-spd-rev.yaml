# Ultralytics YOLOv8 with Conv->SpaceToDepth (SPD-Conv reverse order) + P2 head
# Replace backbone downsampling blocks only with: Conv(stride=1) -> SpaceToDepth(scale=2)

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8 backbone (Conv -> SPD at each downsampling stage)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 1]]        # 0
  - [-1, 1, SpaceToDepth, [2]]       # 1  -> P1/2

  - [-1, 1, Conv, [128, 3, 1]]       # 2
  - [-1, 1, SpaceToDepth, [2]]       # 3  -> P2/4
  - [-1, 3, C2f, [128, True]]        # 4

  - [-1, 1, Conv, [256, 3, 1]]       # 5
  - [-1, 1, SpaceToDepth, [2]]       # 6  -> P3/8
  - [-1, 6, C2f, [256, True]]        # 7

  - [-1, 1, Conv, [512, 3, 1]]       # 8
  - [-1, 1, SpaceToDepth, [2]]       # 9  -> P4/16
  - [-1, 6, C2f, [512, True]]        # 10

  - [-1, 1, Conv, [1024, 3, 1]]      # 11
  - [-1, 1, SpaceToDepth, [2]]       # 12 -> P5/32
  - [-1, 3, C2f, [1024, True]]       # 13
  - [-1, 1, SPPF, [1024, 5]]         # 14

# YOLOv8-p2 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 10], 1, Concat, [1]]       # 16 cat backbone P4
  - [-1, 3, C2f, [512]]              # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]        # 19 cat backbone P3
  - [-1, 3, C2f, [256]]              # 20 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # 22 cat backbone P2
  - [-1, 3, C2f, [128]]              # 23 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]       # 24 P2 -> P3 (standard PAN downsample)
  - [[-1, 20], 1, Concat, [1]]       # 25 cat head P3
  - [-1, 3, C2f, [256]]              # 26 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]       # 27 P3 -> P4 (standard PAN downsample)
  - [[-1, 17], 1, Concat, [1]]       # 28 cat head P4
  - [-1, 3, C2f, [512]]              # 29 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]       # 30 P4 -> P5 (standard PAN downsample)
  - [[-1, 14], 1, Concat, [1]]       # 31 cat head P5
  - [-1, 3, C2f, [1024]]             # 32 (P5/32-large)

  - [[23, 26, 29, 32], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
