# YOLOv8m-P2 + MKIR backbone + local/deep C2f_PConv + AFPN spatial fusion
# + WCG post-gate + BiFPN-style backbone re-injection on PAN P3/P4 nodes.

nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, MKIR, [128, 2.0, [1, 3, 5], False, True]] # 3 P2
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, MKIR, [256, 2.0, [1, 3, 5], False, True]] # 6 P3
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 6, C2f_PConv, [512, True]] # 8 deep replace
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], False, True]] # 9 P4
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 3, C2f_PConv, [1024, True]] # 11 deep replace
  - [-1, 1, SPPF, [1024, 5]] # 12
  - [-1, 1, MKIR, [1024, 2.0, [1, 3, 5], False, True]] # 13 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, AFPNWCGConcat2, [1]] # P3 top-down
  - [-1, 3, C2f, [256]] # 19

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, AFPNWCGConcat2, [1]] # P2 top-down
  - [-1, 3, C2f, [128]] # 22

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 19, 6], 1, AFPNWCGConcat3, [1]] # P3 PAN + backbone P3 skip
  - [-1, 3, C2f, [256]] # 25

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16, 9], 1, AFPNWCGConcat3, [1]] # P4 PAN + backbone P4 skip
  - [-1, 3, C2f_PConv, [512]] # 28 deep replace

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f_PConv, [1024]] # 31 deep replace

  - [[22, 25, 28, 31], 1, Detect, [nc]]
