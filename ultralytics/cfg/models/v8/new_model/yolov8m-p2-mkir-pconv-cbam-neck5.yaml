# YOLOv8m-P2 + MKIR backbone + local/deep C2f_PConv + CBAM on 5 neck nodes.
# Placement:
# 1) Skip the first FAN block (P4_td) to avoid overloading the neck entrance.
# 2) Add CBAM on FAN P3.
# 3) Add CBAM on all PAN outputs: P2, P3, P4, P5.

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, MKIR, [128, 2.0, [1, 3, 5], False, True]] # 3 P2
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, MKIR, [256, 2.0, [1, 3, 5], False, True]] # 6 P3
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 6, C2f_PConv, [512, True]] # 8 deep replace
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], False, True]] # 9 P4
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 3, C2f_PConv, [1024, True]] # 11 deep replace
  - [-1, 1, SPPF, [1024, 5]] # 12
  - [-1, 1, MKIR, [1024, 2.0, [1, 3, 5], False, True]] # 13 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 16 (FAN P4, no CBAM here)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 19
  - [-1, 1, CBAM, []] # 20 FAN P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]] # cat backbone P2
  - [-1, 3, C2f, [128]] # 23 (P2/4-xsmall)
  - [-1, 1, CBAM, []] # 24 PAN P2

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 20], 1, Concat, [1]] # cat CBAM-refined FAN P3
  - [-1, 3, C2f, [256]] # 27 (P3/8-small)
  - [-1, 1, CBAM, []] # 28 PAN P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat FAN P4
  - [-1, 3, C2f_PConv, [512]] # 31 (P4/16-medium), deep replace
  - [-1, 1, CBAM, []] # 32 PAN P4

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat backbone P5
  - [-1, 3, C2f_PConv, [1024]] # 35 (P5/32-large), deep replace
  - [-1, 1, CBAM, []] # 36 PAN P5

  - [[24, 28, 32, 36], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
