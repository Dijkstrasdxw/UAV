# YOLOv8m-P2 + MKIR backbone + local/deep C2f_PConv + dynamic fusion on key P3/P2 top-down nodes.
# Fusion block logic:
# 1) branch-adaptive weighting
# 2) weighted concat
# 3) dynamic 3x3 fusion refine
# 4) internal 1x1 channel restore

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, MKIR, [128, 2.0, [1, 3, 5], False, True]] # 3 P2
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, MKIR, [256, 2.0, [1, 3, 5], False, True]] # 6 P3
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 6, C2f_PConv, [512, True]] # 8 deep replace
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], False, True]] # 9 P4
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 3, C2f_PConv, [1024, True]] # 11 deep replace
  - [-1, 1, SPPF, [1024, 5]] # 12
  - [-1, 1, MKIR, [1024, 2.0, [1, 3, 5], False, True]] # 13 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, DynamicFusion2, [256, 4, 4]] # weighted concat + dynamic 3x3 + 1x1 restore for P3 td
  - [-1, 3, C2f, [256]] # 19 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, DynamicFusion2, [128, 4, 4]] # weighted concat + dynamic 3x3 + 1x1 restore for P2 td
  - [-1, 3, C2f, [128]] # 22 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 19], 1, Concat, [1]] # cat head P3
  - [-1, 3, C2f, [256]] # 25 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f_PConv, [512]] # 28 (P4/16-medium), deep replace

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f_PConv, [1024]] # 31 (P5/32-large), deep replace

  - [[22, 25, 28, 31], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
