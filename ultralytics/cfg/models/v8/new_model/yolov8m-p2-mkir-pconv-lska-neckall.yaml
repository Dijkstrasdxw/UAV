# YOLOv8m-P2 + MKIR backbone + local/deep C2f_PConv + LSKA on all neck stages.
# Design:
# 1) Keep the verified MKIR + PConv baseline unchanged.
# 2) Add LSKA to both top-down(FAN) and bottom-up(PAN) neck outputs.
# 3) Feed the LSKA-refined FAN features into the subsequent PAN path.

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, MKIR, [128, 2.0, [1, 3, 5], False, True]] # 3 P2
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, MKIR, [256, 2.0, [1, 3, 5], False, True]] # 6 P3
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 6, C2f_PConv, [512, True]] # 8 deep replace
  - [-1, 1, MKIR, [512, 2.0, [1, 3, 5], False, True]] # 9 P4
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 3, C2f_PConv, [1024, True]] # 11 deep replace
  - [-1, 1, SPPF, [1024, 5]] # 12
  - [-1, 1, MKIR, [1024, 2.0, [1, 3, 5], False, True]] # 13 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 16
  - [-1, 1, LSKA, [23]] # 17 FAN P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 20
  - [-1, 1, LSKA, [23]] # 21 FAN P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]] # cat backbone P2
  - [-1, 3, C2f, [128]] # 24 (P2/4-xsmall)
  - [-1, 1, LSKA, [23]] # 25 PAN P2

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 21], 1, Concat, [1]] # cat LSKA-refined FAN P3
  - [-1, 3, C2f, [256]] # 28 (P3/8-small)
  - [-1, 1, LSKA, [23]] # 29 PAN P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]] # cat LSKA-refined FAN P4
  - [-1, 3, C2f_PConv, [512]] # 32 (P4/16-medium), deep replace
  - [-1, 1, LSKA, [23]] # 33 PAN P4

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat backbone P5
  - [-1, 3, C2f_PConv, [1024]] # 36 (P5/32-large), deep replace
  - [-1, 1, LSKA, [23]] # 37 PAN P5

  - [[25, 29, 33, 37], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
