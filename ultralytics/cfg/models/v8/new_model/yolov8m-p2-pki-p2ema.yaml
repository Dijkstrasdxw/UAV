# YOLOv8m-P2 with PKI backbone multi-scale blocks + single P2 detect-only EMA

nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
