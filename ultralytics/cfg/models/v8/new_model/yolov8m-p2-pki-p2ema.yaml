  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, PKIModule, [1024, 1.0, [3, 5, 7, 9, 11], True]]

