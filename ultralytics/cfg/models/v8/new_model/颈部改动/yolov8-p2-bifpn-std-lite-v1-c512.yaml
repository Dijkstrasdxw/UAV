# Ultralytics YOLOv8-P2 with standard-style BiFPN (EfficientDet-like) single block
# c512 variant: increase BiFPN width to c512 for higher fusion capacity

# Parameters
nc: 80
scale: m
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# Standard-style BiFPN head (single block, c=512)
head:
  # Lateral projection (unified FPN width)
  - [2, 1, Conv, [512, 1, 1]] # 10 P2_in
  - [4, 1, Conv, [512, 1, 1]] # 11 P3_in
  - [6, 1, Conv, [512, 1, 1]] # 12 P4_in
  - [9, 1, Conv, [512, 1, 1]] # 13 P5_in

  # Top-down pathway
  - [13, 1, nn.Upsample, [None, 2, "nearest"]]                 # 14 P5 -> P4
  - [[12, 14], 1, BiFPNNode, [512, 2, 1e-4, False]]            # 15 P4_td
  - [15, 1, nn.Upsample, [None, 2, "nearest"]]                 # 16 P4_td -> P3
  - [[11, 16], 1, BiFPNNode, [512, 2, 1e-4, False]]            # 17 P3_td
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]                 # 18 P3_td -> P2
  - [[10, 18], 1, BiFPNNode, [512, 2, 1e-4, False]]            # 19 P2_out

  # Bottom-up pathway (keep same-level backbone inputs)
  - [19, 1, Conv, [512, 3, 2]]                                 # 20 down(P2_out) -> P3
  - [[11, 17, 20], 1, BiFPNNode, [512, 3, 1e-4, False]]        # 21 P3_out
  - [21, 1, Conv, [512, 3, 2]]                                 # 22 down(P3_out) -> P4
  - [[12, 15, 22], 1, BiFPNNode, [512, 3, 1e-4, False]]        # 23 P4_out
  - [23, 1, Conv, [512, 3, 2]]                                 # 24 down(P4_out) -> P5
  - [[13, 24], 1, BiFPNNode, [512, 2, 1e-4, False]]            # 25 P5_out

  - [[19, 21, 23, 25], 1, Detect, [nc]]                        # Detect(P2, P3, P4, P5)
